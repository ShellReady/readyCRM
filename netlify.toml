# Netlify configuration for Single Page Application & build settings
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API routes routed directly to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA Fallback rule so all routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

